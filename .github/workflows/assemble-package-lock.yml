name: assemble-package-lock
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assemble-package-lock.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit exact package-lock.json
        env:
          LOCK_URL: https://litter.catbox.moe/xl8cux.json
          EXPECTED_BLOB: cf00fc8d7b9951923cd7f34e17711533e1ae1b42
        run: |
          set -euo pipefail
          curl -fsSL -o package-lock.json "$LOCK_URL"
          ACTUAL="$(git hash-object package-lock.json)"
          echo "blob $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_BLOB"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/assemble-package-lock.yml
          git add package-lock.json
          git add -u .github/workflows/assemble-package-lock.yml || true
          git status
          git commit -m "Add exact package-lock.json"
          git push
